name: worker test
permissions:
  contents: read
on:
  push:
    branches:
      - master
      - develop
      - feature/*
jobs:
  lint:
    strategy:
      matrix:
        platform: [ubuntu-latest]
    runs-on: ${{ matrix.platform }}
    container: golang:1.26.2
    steps:

      - name: Check out code
        uses: actions/checkout@v6
        with:
          # avoid requiring a newer self-hosted runner for container auth
          persist-credentials: false

      - name: test
        run: |
          go test ./...
          
      - name: test race
        run: |
          go test ./... -race=1

  codeql:
    name: CodeQL - analyze
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Initialize CodeQL
        uses: github/codeql-action/init@v2
        with:
          languages: go
      - name: Autobuild
        uses: github/codeql-action/autobuild@v2
      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v2

  semgrep:
    name: Semgrep scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Run Semgrep
        uses: returntocorp/semgrep-action@v1
        with:
          config: default

  dependency-scan:
    name: Dependency Vulnerability Scan (Grype)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Run Grype scan
        uses: anchore/grype-action@v1
        with:
          # policy: fail on medium+ severity (adjust as needed)
          fail-on: medium

        