name: worker test
on:
  pull_request:
  push:
    branches:
      - master
      - develop
      - feature/*
      - codex/**

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      - name: Test with race detector
        run: go test -race ./...

      - name: Check module tidiness
        run: |
          go mod tidy -diff
          (cd benchmarks && go mod tidy -diff)

      - name: Vet benchmarks module
        working-directory: benchmarks
        run: go vet ./...

      - name: Check benchmark harness with race detector
        working-directory: benchmarks
        run: go test -race -run '^$' -bench '^Benchmark(Pool|ConcurrentSubmit|Latency)$' -benchtime=100x -cpu=8 -timeout=5m
